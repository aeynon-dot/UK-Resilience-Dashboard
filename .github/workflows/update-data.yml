name: Update UK resilience data
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths-ignore:
      - 'data/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-resilience-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        # v6 stores the temporary credential outside .git/config; required for the data commit.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Collect official feeds
        run: python scripts/build_data.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Publish data through protected-main PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current.json data/history.json
          if git diff --cached --quiet; then
            echo 'No data changes to publish.'
            exit 0
          fi
          git commit -m 'Update resilience data'
          git push --force-with-lease origin HEAD:automation/data-update

          pr_number="$(gh pr list --base main --head automation/data-update --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh pr create \
              --base main \
              --head automation/data-update \
              --title 'Automated resilience data update' \
              --body 'Automated public resilience data refresh. Required repository checks must pass before merge.')"
          fi
          gh pr merge "$pr_number" --auto --squash
