name: Update UK resilience data
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths-ignore:
      - 'data/**'

permissions:
  contents: read

concurrency:
  group: update-resilience-data
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Collect official feeds
        run: python scripts/build_data.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Create publisher App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RESILIENCE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RESILIENCE_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure Git for publisher App
        run: |
          user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${user_id}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Publish validated data to main and approved production branch
        shell: bash
        run: |
          set -euo pipefail
          git add data/current.json data/history.json
          git diff --cached --quiet || git commit -m 'Update resilience data'
          git push origin HEAD:main

          # Preserve the approved production UI: carry only the two validated data files.
          mkdir -p "$RUNNER_TEMP/validated-data"
          cp data/current.json data/history.json "$RUNNER_TEMP/validated-data/"
          git fetch origin production-data-refresh-2026-10-10
          git checkout -B production-data-refresh-2026-10-10 origin/production-data-refresh-2026-10-10
          cp "$RUNNER_TEMP/validated-data/current.json" data/current.json
          cp "$RUNNER_TEMP/validated-data/history.json" data/history.json
          git add data/current.json data/history.json
          if git diff --cached --quiet; then
            echo "No production data changes to publish."
            exit 0
          fi
          git commit -m 'Update production resilience data'
          git push origin HEAD:production-data-refresh-2026-10-10
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
