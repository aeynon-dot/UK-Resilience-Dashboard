name: Update UK resilience data
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths-ignore:
      - 'data/**'

permissions:
  contents: read

concurrency:
  group: update-resilience-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
        # The publisher App token, not GITHUB_TOKEN, performs the data push.

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Collect official feeds
        run: python scripts/build_data.py

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Create publisher App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RESILIENCE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RESILIENCE_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure Git for publisher App
        run: |
          user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${user_id}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit and publish updated data
        run: |
          git add data/current.json data/history.json
          git diff --cached --quiet || git commit -m 'Update resilience data'
          git push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
